<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>クレーム対応事例 | コールセンター ナレッジベース</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="container header-inner">
    <a class="logo" href="index.html">📞 コールセンター ナレッジベース</a>
    <nav class="main-nav">
      <a href="index.html">ホーム</a>
      <a href="faq.html">FAQ</a>
      <a href="flow.html">切り分けフロー</a>
      <a href="escalation.html">手上げ記録</a>
      <a href="claim.html" class="active">クレーム対応事例</a>
    </nav>
  </div>
</header>

<main class="container">
  <h1 class="page-title">クレーム対応事例</h1>
  <p class="page-desc">過去のクレーム対応の内容・結果・再発防止策を記録し、類似事例の対応時に参照します。</p>

  <div class="card">
    <h2>新規登録</h2>
    <form id="claim-form">
      <div class="form-grid">
        <div class="field">
          <label for="claim-date">発生日</label>
          <input type="date" id="claim-date" required />
        </div>
        <div class="field">
          <label for="claim-category">カテゴリ</label>
          <select id="claim-category">
            <option value="対応品質">対応品質</option>
            <option value="料金・契約">料金・契約</option>
            <option value="サービス品質">サービス品質</option>
            <option value="個人情報・プライバシー">個人情報・プライバシー</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div class="field full">
          <label for="claim-content">クレーム内容</label>
          <textarea id="claim-content" required placeholder="お客様からのクレームの内容を記入してください"></textarea>
        </div>
        <div class="field full">
          <label for="claim-response">対応内容</label>
          <textarea id="claim-response" required placeholder="実際に行った対応内容を記入してください"></textarea>
        </div>
        <div class="field full">
          <label for="claim-result">対応結果</label>
          <textarea id="claim-result" placeholder="お客様の反応・最終的な結果を記入してください"></textarea>
        </div>
        <div class="field full">
          <label for="claim-lesson">再発防止策・教訓</label>
          <textarea id="claim-lesson" placeholder="今後同様のクレームを防ぐための対策や、対応時の注意点を記入してください"></textarea>
        </div>
      </div>
      <div class="btn-row">
        <button type="submit" class="btn">登録する</button>
      </div>
    </form>
  </div>

  <div class="toolbar">
    <div class="field">
      <label for="search-input">キーワード検索</label>
      <input type="search" id="search-input" placeholder="クレーム内容・対応内容・教訓から検索" />
    </div>
    <div class="field">
      <label for="filter-category">カテゴリで絞り込み</label>
      <select id="filter-category">
        <option value="">すべて</option>
        <option value="対応品質">対応品質</option>
        <option value="料金・契約">料金・契約</option>
        <option value="サービス品質">サービス品質</option>
        <option value="個人情報・プライバシー">個人情報・プライバシー</option>
        <option value="その他">その他</option>
      </select>
    </div>
  </div>

  <div id="claim-list"></div>
  <p class="empty-state" id="empty-state" style="display:none;">該当する事例が見つかりませんでした。</p>
</main>

<script src="js/storage.js"></script>
<script>
  const DEFAULT_CLAIMS = [
    {
      id: "seed-1",
      date: "2025-02-03",
      category: "対応品質",
      content: "電話対応の際、こちらの説明が分かりにくく、解決まで何度も同じ内容を聞かれて時間がかかったとのご指摘があった。",
      response: "ご不便をおかけしたことをお詫びし、改めて手順を一つずつ確認しながら案内し直した。最終的にはお客様の問題は解決した。",
      result: "お客様にはご納得いただき、対応終了。後日担当者へフィードバックを実施。",
      lesson: "案内時は一文ずつ区切り、お客様の理解度を確認しながら進める。FAQの文言も平易な表現に見直す。",
      createdAt: "2025-02-03 15:20",
    },
    {
      id: "seed-2",
      category: "料金・契約",
      date: "2025-02-20",
      content: "解約手続きをしたはずなのに翌月も課金されていたとのご連絡があった。",
      response: "契約状況を確認したところ、解約申請が完了していなかったことが判明。お詫びの上、即時解約処理を行い、誤って課金された分は返金手続きを実施した。",
      result: "返金処理完了後、お客様より了承いただいた。",
      lesson: "解約手続き完了後は、完了通知メールを必ず送信する運用に変更。手続きの最終確認画面の文言も見直す。",
      createdAt: "2025-02-20 11:05",
    },
  ];

  let claims = loadItems("claims", DEFAULT_CLAIMS);

  const listEl = document.getElementById("claim-list");
  const emptyEl = document.getElementById("empty-state");
  const searchInput = document.getElementById("search-input");
  const filterCategory = document.getElementById("filter-category");

  document.getElementById("claim-date").value = todayForInput();

  function render() {
    const keyword = searchInput.value.trim().toLowerCase();
    const category = filterCategory.value;

    const filtered = claims.filter((c) => {
      if (category && c.category !== category) return false;
      if (!keyword) return true;
      const haystack = [c.content, c.response, c.result, c.lesson].join(" ").toLowerCase();
      return haystack.includes(keyword);
    });

    listEl.innerHTML = "";
    emptyEl.style.display = filtered.length ? "none" : "block";

    filtered
      .slice()
      .sort((a, b) => (b.date || "").localeCompare(a.date || ""))
      .forEach((c) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="faq-meta" style="margin-top:0; margin-bottom: 10px;">
            <span class="badge category">${escapeHtml(c.category)}</span>
            <span class="tag">発生日: ${escapeHtml(c.date)}</span>
          </div>
          <h3>クレーム内容</h3>
          <p>${escapeHtml(c.content).replace(/\n/g, "<br>")}</p>
          <h3>対応内容</h3>
          <p>${escapeHtml(c.response).replace(/\n/g, "<br>")}</p>
          ${c.result ? `<h3>対応結果</h3><p>${escapeHtml(c.result).replace(/\n/g, "<br>")}</p>` : ""}
          ${c.lesson ? `<h3>再発防止策・教訓</h3><p>${escapeHtml(c.lesson).replace(/\n/g, "<br>")}</p>` : ""}
          <div class="btn-row">
            <button type="button" class="btn danger btn-delete">削除</button>
          </div>
        `;
        card.querySelector(".btn-delete").addEventListener("click", () => {
          if (!confirm("この事例を削除しますか？")) return;
          claims = claims.filter((x) => x.id !== c.id);
          saveItems("claims", claims);
          render();
        });
        listEl.appendChild(card);
      });
  }

  document.getElementById("claim-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const claim = {
      id: generateId(),
      date: document.getElementById("claim-date").value,
      category: document.getElementById("claim-category").value,
      content: document.getElementById("claim-content").value.trim(),
      response: document.getElementById("claim-response").value.trim(),
      result: document.getElementById("claim-result").value.trim(),
      lesson: document.getElementById("claim-lesson").value.trim(),
      createdAt: nowForInput().replace("T", " "),
    };
    if (!claim.content || !claim.response) return;

    claims.push(claim);
    saveItems("claims", claims);
    e.target.reset();
    document.getElementById("claim-date").value = todayForInput();
    render();
  });

  searchInput.addEventListener("input", render);
  filterCategory.addEventListener("change", render);

  render();
</script>
</body>
</html>
